[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synthform"
version = "0.2.0"
description = "Synthetic scanned-form training samples with handwriting-style text and image-only PDFs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{name = "synthform contributors"}]
keywords = ["synthetic-data", "forms", "ocr", "training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "pillow",
    "pypdf",
    "pypdfium2",
    "reportlab",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
synthform = "synthform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synthform = ["fonts/*/*.ttf", "fonts/*/*.otf", "fonts/*/*.txt", "fonts/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
